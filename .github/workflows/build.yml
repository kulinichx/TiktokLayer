name: Build package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install ldid dpkg make

      - name: Set up Theos
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/theos" ]; then
            git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          fi
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          rm -f packages/*
          make clean package FINALPACKAGE=1

      - name: Rename package
        run: |
          mkdir -p release
          VERSION=$(awk -F': ' '/^Version:/ {print $2}' control)
          DEB=$(ls packages/*.deb | head -n 1)
          cp "$DEB" "release/AwemeX-for-iPad_${VERSION}_${GITHUB_RUN_NUMBER}.deb"
          ls -la release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AwemeX-for-iPad-${{ github.run_number }}
          path: release/*.deb
          if-no-files-found: error
